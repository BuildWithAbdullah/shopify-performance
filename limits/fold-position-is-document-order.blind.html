<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
</head>
<body>
  <img src="/assets/a.jpg" alt="A" width="600" height="600"
       srcset="/assets/a-300.jpg 300w, /assets/a-600.jpg 600w" sizes="50vw">
  <img src="/assets/b.jpg" alt="B" width="600" height="600"
       srcset="/assets/b-300.jpg 300w, /assets/b-600.jpg 600w" sizes="50vw">
  <!--
    This third image is the one a shopper has to scroll a long way to reach,
    because the two above it are full height panels. In document order it is
    image three, so the fold heuristic treats it as visible and says nothing
    about its eager loading.
  -->
  <img src="/assets/c.jpg" alt="C" width="600" height="600"
       srcset="/assets/c-300.jpg 300w, /assets/c-600.jpg 600w" sizes="50vw">
